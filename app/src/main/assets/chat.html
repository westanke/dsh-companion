<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DSH</title>
<style>
:root{
  --bg:#fff; --fg:#1b1b1f; --muted:#6b6b76; --line:#e4e4ea;
  --user:#e8f0fe; --user-fg:#1b3a5c; --card:#f7f7fa; --accent:#2f6fed;
  --warn:#c2740a; --warn-bg:#fff6e5; --danger:#c0392b; --ok:#1e8e3e;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#151517;--fg:#e8e8ed;--muted:#9a9aa5;--line:#2e2e33;
        --user:#1d2a3d;--user-fg:#cfe2ff;--card:#1c1c1f;--accent:#7aa2f7;
        --warn:#e0a458;--warn-bg:#2a2118;--danger:#e06c5f;--ok:#6cc179;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans CJK SC",sans-serif;
  overflow:hidden;overscroll-behavior:none}
/* 每个可滚容器都要单独声明。早先只在 body 上写了 overscroll-behavior:none，
   但 #log 自己能滚，滑到内容边缘继续拖时系统照样弹出侧边栏 ——
   表现为「会话里上滑，偶尔左边滑出侧边栏」。 */
#log,#todos .body,#files .body{overscroll-behavior:contain}
/* 长路径 / 长代码行会横向撑开，滑到边界后的余下拖动也会被系统当成侧滑。
   统一禁止横向溢出：代码块自己内部滚，不让整页横移。 */
body{overflow-x:hidden}
.md,.msg{max-width:100%}
pre{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
td,th{max-width:0;word-break:break-word}
#bar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--bg)}
#title{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto}
#dot.on{background:var(--ok)}
#dot.off{background:var(--danger)}
.iconbtn{width:34px;height:34px;flex:0 0 auto;border:0;border-radius:8px;background:transparent;
  color:var(--fg);font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center}
.iconbtn:active{background:var(--card)}
.iconbtn:disabled{opacity:.35}
#log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 6px}
/* 左右分栏，像聊天软件一样一眼看出谁说的。
   关键取舍：**助手消息不设宽度上限**。它里面常有表格、代码块与卡片，
   塞进窄气泡会被挤成一条条细缝，比原来更难读；所以只让它靠左、不限量宽。
   用户消息短，靠右 + 底色 + 限宽 78%，视觉上自然形成两边。 */
.msg{margin:0 0 12px;max-width:100%;display:flex;flex-direction:column}
.m-user{align-items:flex-end}
.m-assistant,.m-system{align-items:flex-start}
.m-user .bubble{background:var(--accent);color:#fff;border-radius:14px 14px 3px 14px;
  padding:9px 13px;max-width:78%;white-space:pre-wrap;word-break:break-word}
.m-assistant .bubble{max-width:100%}
.m-system .bubble{color:var(--muted);font-size:13px;padding:2px 4px}
.m-user .role{align-self:flex-end;margin:0 2px 4px}
.m-assistant .role{align-self:flex-start;margin:0 2px 4px}
.role{font-size:11px;color:var(--muted)}
/* 用户气泡里的长代码块/表格别把气泡撑爆 */
.m-user .bubble pre{max-width:100%}
.act{border-left:2px solid var(--line);padding:5px 0 5px 10px;margin:0 0 10px;color:var(--muted);font-size:13.5px}
.act summary{cursor:pointer;list-style:none;display:flex;gap:7px;align-items:center;font-weight:600}
.act summary::-webkit-details-marker{display:none}
.act .caret{transition:transform .15s;flex:0 0 auto;font-size:10px}
.act[open] .caret{transform:rotate(90deg)}
.act .body{margin-top:6px;white-space:pre-wrap;word-break:break-word;color:var(--fg)}
/* ── 工具调用组 ──
   组头一行（动作摘要，如「运行了代码，修改了文件」），组内每条也只占一行；
   完整参数与结果要点开单条才显示。这样几十次调用也只占一个块。
   组头刻意**不报次数** —— 摘要已经把「做了什么」说清楚了，次数是给日志看的。 */
.act.tools .tnames{color:var(--muted);font-weight:400;font-size:12px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tlist{margin-top:5px}
.ti{border-top:1px solid var(--line)}
.ti>summary{display:flex;gap:7px;align-items:center;cursor:pointer;list-style:none;
  padding:5px 0;font-size:12.5px;font-weight:400;color:var(--muted)}
.ti>summary::-webkit-details-marker{display:none}
.ti .caret{font-size:9px;transition:transform .15s;flex:0 0 auto}
.ti[open] .caret{transform:rotate(90deg)}
.ti .tn{font-weight:600;color:var(--fg);flex:0 0 auto}
.ti .ta1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.ti .tst{flex:0 0 auto;font-size:11px}
.ti .tst.ok{color:var(--ok)}
.ti .tst.err{color:var(--danger)}
.tbody{padding:2px 0 8px 16px}
.targs{margin:4px 0;max-height:160px;overflow:auto;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.tres{margin:4px 0;max-height:220px;overflow:auto;color:var(--muted);
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:pre-wrap;word-break:break-word}
.tres.err{color:var(--danger)}
/* 思考条：消息区下方、输入区上方的一条固定位置，不随消息滚动。
   有思考时显示一行（右侧省略号截断），没有时整条隐藏。 */
#thinkbar{flex:0 0 auto;display:flex;gap:7px;align-items:center;
  margin:0;padding:6px 14px;border-top:1px solid var(--line);
  background:var(--card);color:var(--muted);font-size:12.5px}
#thinkbar[hidden]{display:none}
#thinkbar .spin{flex:0 0 auto;animation:spin 1.2s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#thinkbar .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md>p:first-child{margin-top:0}.md>p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4{margin:14px 0 7px;line-height:1.3}
.md h1{font-size:1.3em}.md h2{font-size:1.18em}.md h3{font-size:1.08em}.md h4{font-size:1em}
.md ul,.md ol{margin:7px 0;padding-left:22px}
.md li{margin:3px 0}
.md blockquote{margin:8px 0;padding:2px 0 2px 12px;border-left:3px solid var(--line);color:var(--muted)}
.md a{color:var(--accent);text-decoration:underline;word-break:break-all}
.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
/* markdown 表格：与卡片内表格同一套做法 —— 滚动容器套在**外面**，
   table 自己保持 display:table。
 *
 * 这里原先写的就是 display:block（和 2.2.4 在 .card table 上修掉的是**同一个错误**），
 * 当时只修了卡片那处、漏了这里 —— 于是普通 markdown 表格也被压成一字一列
 * （真机截图里表头「环节」是竖着排的）。同一个坑踩两次，这次两处一起收口。 */
.md .tw{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.md table{border-collapse:collapse;margin:9px 0;font-size:13px;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:var(--card)}
.md img{max-width:100%;border-radius:8px}
pre{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:11px;margin:9px 0;overflow-x:auto;position:relative}
pre code{font:13px/1.55 ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  white-space:pre;display:block}
:not(pre)>code{background:var(--card);border:1px solid var(--line);border-radius:5px;
  padding:1px 5px;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.copy{position:absolute;top:6px;right:6px;border:1px solid var(--line);background:var(--bg);
  color:var(--muted);border-radius:6px;font-size:11px;padding:3px 7px;cursor:pointer;opacity:0;
  transition:opacity .15s}
pre:hover .copy{opacity:1}
.approve{border:1px solid var(--warn);background:var(--warn-bg);border-radius:12px;
  padding:12px;margin:0 0 12px}
.approve .hd{font-weight:700;color:var(--warn);font-size:14px;display:flex;gap:7px;align-items:center}
.approve .cmd{margin-top:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:8px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;
  word-break:break-all;max-height:150px;overflow:auto}
.approve .btns{display:flex;gap:8px;margin-top:11px}
.approve button{flex:1;border:0;border-radius:9px;padding:10px;font-weight:600;font-size:14px;cursor:pointer}
.approve .no{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.approve .yes{background:var(--ok);color:#fff}
/* ── 问答卡（ask_user_question）──
   外形**复用**审批卡那一套（.approve）：同一种「需要你出手」的卡片就该长得一样，
   两处不一致这件事用户已经报过一次。只用主色把语义分开：
   审批=危险，请核对命令；问答=等你回答，没有危险。 */
.approve.ask{border-color:var(--accent)}
.approve.ask .hd{color:var(--accent)}
.approve.ask .hd.done{color:var(--ok)}
.approve .q{margin-top:10px}
.approve .qh{font-weight:700;font-size:13.5px;color:var(--accent)}
.approve .qt{font-size:14px;line-height:1.5}
.approve .qd{color:var(--muted);font-size:12.5px;margin-top:2px}
.approve .opt{display:flex;gap:8px;align-items:flex-start;margin-top:7px;cursor:pointer}
.approve .opt input{margin:3px 0 0;flex:0 0 auto}
.approve .opt span{min-width:0}
.approve .opt em{display:block;color:var(--muted);font-style:normal;font-size:12.5px}
.approve textarea.custom{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:8px;
  padding:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px;resize:vertical}
#todos{margin:0 12px 10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;font-size:13px;flex:0 0 auto;max-height:34vh;overflow:auto}
/* details 默认没有 marker，用自己的箭头。展开时限制高度，折叠时只占一行。 */
#todos>summary,#files>summary{list-style:none;cursor:pointer;display:flex;gap:8px;
  align-items:center;font-weight:600}
#todos>summary::-webkit-details-marker,#files>summary::-webkit-details-marker{display:none}
#todos>summary .caret,#files>summary .caret{transition:transform .15s;flex:0 0 auto;font-size:10px}
#todos[open]>summary .caret,#files[open]>summary .caret{transform:rotate(90deg)}
#todos>summary .cnt,#files>summary .cnt{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}
#todos>div{margin-top:7px}
#todos .it{display:flex;gap:8px;padding:3px 0;align-items:flex-start}
#todos .ic{flex:0 0 auto;margin-top:1px}
#todos .done{color:var(--muted);text-decoration:line-through}
#todos .busy{color:var(--accent)}
#todos[hidden]{display:none}
#comp{flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg);
  padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
#warn{font-size:12px;color:var(--muted);padding:0 3px 6px}
/* 输入区：**一整条药丸**，+ 和发送都在里面。
   早先是三个独立控件（圆形 + 按钮 / 圆角输入框 / 圆形发送键）横排，
   输入框被两个圆按钮夹着，既没占满宽度、圆角也对不齐，看着别扭。 */
#row{display:flex;align-items:flex-end;gap:2px;width:100%;
  border:1px solid var(--line);border-radius:22px;background:var(--card);
  padding:3px 4px 3px 2px;min-height:44px}
#row:focus-within{border-color:var(--accent)}
/* 输入框自己不再画边框和圆角 —— 外框由 #row 统一画。 */
#ta{flex:1;min-width:0;min-height:36px;max-height:120px;padding:8px 4px;
  border:0;border-radius:0;background:transparent;color:var(--fg);
  font:inherit;font-size:15px;resize:none;outline:0;line-height:1.4}
#send{width:34px;height:34px;flex:0 0 auto;border:0;border-radius:50%;
  background:var(--accent);color:#fff;font-size:14px;cursor:pointer;
  display:grid;place-items:center;margin-bottom:1px}
/* 禁用时不再整体压透明度（那样会连底色一起淡掉）；改成透明底 + 灰字，
   位置和大小都不跳，用户看得出来「现在还不能发」但不觉得是残废控件。 */
#send:disabled{background:transparent;color:var(--muted);opacity:1}
/* 占位符超长时省略成一行，绝不换行 —— 换行会被输入框高度裁掉半截。
   只作用于 ::placeholder，不影响用户实际输入的多行换行。 */
#ta::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmd{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px 7px}
#cmd button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;
  padding:4px 11px;font-size:12.5px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--fg);
  color:var(--bg);padding:9px 17px;border-radius:20px;font-size:13.5px;z-index:50;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:82vw;text-align:center}
#toast.show{opacity:.96}
#empty{color:var(--muted);text-align:center;padding:38px 20px;font-size:14px}
/* 诊断条：只在异常时出现，平时 hidden，不干扰正常聊天 */
/* 诊断条早先是 position:fixed; bottom:0，直接压在输入框上——
   「发送」按钮点不到。改成插在消息流末尾，不悬浮，就不会再挡任何东西。 */
#diag{margin:8px 12px 4px;background:var(--warn-bg);color:var(--warn);
  border:1px solid var(--warn);border-radius:8px;font-size:12px;padding:7px 12px;
  cursor:pointer;flex:0 0 auto}
#diag[hidden]{display:none}
/* 提示气泡原来 bottom:88px，同样会压到输入区，抬到输入框之上 */
#toast{bottom:104px}
/* ── 会话文件 ── */
#files{margin:0 12px 10px;padding:10px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;font-size:13px;flex:0 0 auto}
#files[hidden]{display:none}
#files .body{margin-top:7px;max-height:30vh;overflow:auto}
#files .f{display:block;width:100%;text-align:left;border:0;background:transparent;
  color:var(--fg);padding:5px 6px;border-radius:6px;cursor:pointer}
#files .f:active{background:var(--line)}
#files .f .n{font-size:13px}
#files .f .p{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;word-break:break-all}
/* ── dsh-ui 卡片 ── */
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--card)}
.card .t{font-weight:700;font-size:14px;margin-bottom:8px}
.card .c{padding:7px 0}
.card .c + .c{border-top:1px solid var(--line)}
.card .kv{display:flex;gap:10px;font-size:13px;padding:3px 0}
.card .kv .k{color:var(--muted);flex:0 0 80px}
.card .kv .v{flex:1;word-break:break-word}
/* 卡片内表格：窄屏放不下就横向滚，压列宽会让每格都读不了。
 *
 * 滚动容器必须套在**外面**，不能让 table 自己 display:block。
 * 早先就是后者 —— table 一旦变成 block 就脱离了表格布局算法，
 * 列宽算不出来，几列会叠在同一位置（真机上「问题」和「改法」两列叠成一团，
 * 表头挤成「问题法」）。正确做法：外层 .tw 负责滚动，table 保持 display:table。
 */
.card .tw{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
/* 宽度必须是**下限**不是**定值**。
 * 早先写 width:100%，那是硬约束：单元格又设了 nowrap，内容比容器宽时列被强行压窄，
 * 文字只能溢出格子、压到右边一列上（真机截图里 ✓ 徽标压在「Office 文档（officecli）」）。
 * 改成 min-width:100% —— 内容窄时铺满宽度，内容宽时表格自然撑开、由外层 .tw 横向滚。 */
.card table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.card th,.card td{border:1px solid var(--line);padding:5px 8px;text-align:left;
  white-space:nowrap;vertical-align:top}
/* 单元格里的徽标与左边文字留一点缝，别贴着。 */
.card td .badge{margin-left:2px}
.card th{background:var(--bg);font-weight:600}
/* 列表 / 步骤 / 时间线 */
.card .gs{margin:4px 0;padding-left:20px;font-size:13px}
.card .gs li{margin:3px 0}
.card .tl{list-style:none;padding-left:0}
.card .tl li{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:5px 0}
.card .tm{color:var(--muted);font-size:12px;margin-right:5px}
/* 徽标 / 进度条 */
.card .badge{display:inline-block;border:1px solid var(--line);border-radius:10px;
  padding:2px 9px;font-size:12px;background:var(--bg)}
.card .badge.ok{border-color:var(--ok);color:var(--ok)}
.card .badge.warn{border-color:var(--warn);color:var(--warn)}
.card .pg{display:flex;align-items:center;gap:8px;font-size:12.5px}
.card .pgbar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.card .pgbar i{display:block;height:100%;background:var(--accent)}
/* 提示块：按 tone 上色，正文在 content 字段 */
.card .co{border-radius:9px;padding:9px 11px;font-size:13px;
  background:var(--card);border:1px solid var(--line)}
.card .co .cot{font-weight:600;margin-bottom:3px}
.card .co.ok{border-color:var(--ok)}
.card .co.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.card .co.err{border-color:var(--danger);color:var(--danger)}
/* 差异 */
.card .tf{font:12px ui-monospace,Menlo,monospace;color:var(--muted);margin-top:4px}
.card .dl{font:12.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
.card .dl.add{color:var(--ok)}
.card .dl.del{color:var(--danger)}
.card .gd{border:0;border-top:1px solid var(--line);margin:8px 0}
/* 未识别类型：标题淡一点，内容仍按可读键值对列出 */
.card .unk{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
/* ── 待发附件 ── */
#atts{display:flex;flex-wrap:wrap;gap:6px;padding:0 2px 7px}
#atts[hidden]{display:none}
#atts .a{display:flex;align-items:center;gap:5px;border:1px solid var(--line);
  background:var(--card);border-radius:14px;padding:3px 5px 3px 9px;font-size:12px;max-width:100%}
#atts .a .nm{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#atts .a .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:0 3px;line-height:1}
#atts .a img{width:22px;height:22px;object-fit:cover;border-radius:5px}
#attachBtn{width:34px;height:34px;flex:0 0 auto;border:0;border-radius:50%;
  background:transparent;color:var(--muted);font-size:20px;cursor:pointer;
  display:grid;place-items:center;margin-bottom:1px}
#attachBtn:active{background:var(--line)}
</style>
</head>
<body>

<div id="bar">
  <button class="iconbtn" id="back" title="返回">‹</button>
  <span id="dot"></span>
  <span id="title">载入中…</span>
  <button class="iconbtn" id="steer" title="插话" disabled>⇥</button>
  <button class="iconbtn" id="stop" title="停止运行" disabled>■</button>
  <button class="iconbtn" id="more" title="模型 / 智能体">⋯</button>
</div>

<!-- 待办与文件都用 details：默认折叠。
     早先两个区块是常驻展开的，文件多的时候直接吃掉小半屏，
     聊天内容被顶到屏幕外 —— 折叠后只占一行标题，要看再点。 -->
<details id="todos" hidden>
  <summary class="hd"><span class="caret">▸</span><span>当前任务</span><span class="cnt" id="todoCnt"></span></summary>
  <div id="todoList"></div>
</details>

<details id="files" hidden>
  <summary class="hd"><span class="caret">▸</span><span>本次产生的文件</span><span class="cnt" id="filesCnt"></span></summary>
  <div class="body" id="filesBody"></div>
</details>

<div id="log"><div id="empty">正在读取会话…</div></div>

<!-- 思考条：占的就是原来诊断条那条位置（消息区下方、输入区上方）。
     流式期间「当前思考」在这里显示一行，没有思考时自动隐藏。
     为什么不放在消息流里：它是**运行状态**而不是会话内容 ——
     插在消息流里会随每条消息滚动、还会把消息挤开；放这条固定位置一眼就能看见。 -->
<div id="thinkbar" hidden>
  <span class="spin">◐</span><span class="tt"></span>
</div>

<div id="comp">
  <div id="warn"></div>
  <div id="cmd" hidden></div>
  <div id="atts" hidden></div>
  <div id="row">
    <button id="attachBtn" title="添加图片或文件">+</button>
    <textarea id="ta" placeholder="输入消息…" rows="1"></textarea>
    <button id="send" disabled>➤</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ── 异常捕获必须在第一行 ──
   早先它排在第 26 行，于是第 26 行之前抛的任何异常都被静默吞掉：
   真机上一片空白，连 __dshErr 都是 null，看着像「没抛异常」，其实可能抛过。
   而且 typeof null === "object"，所以 typeof window.onerror 恒为 object，
   它压根不能证明 onerror 有没有被赋值 —— 我据此误判过好几版。 */
window.__err = null;
window.onerror = function (msg, src, line) {
  window.__err = (msg || '?') + ' @line' + line;
  return false;
};
"use strict";

/* 宿主 App 注入的桥接。有它就走 App 通道（复用其令牌、选路、重试）；
   没有它退回纯 fetch 直连 REST（浏览器预览与联调走这条）。 */
var App = window.DshBridge || null;

var API = "", TOKEN = "", SID = "";
var ws = null, wsRetry = 0, closed = false;
var running = false, canWrite = false;
var pend = {};
var CMD = [];

/* ── 启动烙印 ──
   把「脚本是否执行到哪」直接写进标题栏。

   这一段是查了两轮才加的：页面曾经连续两版都停在「载入中…」与「正在读取会话…」，
   而标题里那个「载入中…」是 HTML 里写死的静态文案。于是有三种可能长得完全一样：
   ① 脚本一行都没跑；② 脚本跑了但在定义 window.dshChat 之前抛了；
   ③ 脚本全跑完了，只是原生没把 init 发过来。
   光看界面分不出来，所以把进度直接印在标题上：
   脚本跑完至少会变成「DSH」，走到 init 才会带上会话名。 */
/* 顶层任何异常都印在屏幕上。
   页面曾经连续两版静默卡住，而我只能看到「正在读取会话…」——
   异常被 WebView 吞进 logcat，真机上根本读不到。 */
window.onerror = function (msg, src, line, col, err) {
  var t = document.getElementById('title');
  if (t) t.textContent = 'JS出错';
  var e = document.getElementById('empty');
  if (e) e.textContent = '脚本出错：' + msg + ' @' + line;
  /* 留一份给原生探测读。
     原生那句 window.dshChat 在不在，只能告诉你「结果」，
     告诉不了你「为什么没有」—— 而没有的原因往往是脚本中途抛了。
     把原始错误钉在 window 上，原生一次 evaluateJavascript 就能读回来。 */
  window.__dshErr = msg + ' @' + src + ':' + line;
  return false;
};

try {
  document.title = 'DSH';
  var t = document.getElementById('title');
  if (t) t.textContent = 'DSH';
} catch (e) {}

var $ = function (id) { return document.getElementById(id); };
var log = $("log"), ta = $("ta");

/* 顶层绑定用：拿到元素，拿不到就给一个**游离节点**接住赋值。
 *
 * 为什么必须兜：顶层绑定在**脚本加载时**执行，一处 null 就会抛异常并中断
 * 整个脚本 —— window.dshChat 都来不及定义，真机表现是整页白屏；
 * 而 file:// 页面把错误详情屏蔽成「Script error. @0」，几乎无从排查。
 * 只读用途仍用 $()，保持「拿不到就是 null」的语义。 */
var BIND_SINK = document.createElement("div");
function bind(id) { return $(id) || BIND_SINK; }

/* 渲染落点：null 表示落到 #log（正常历史渲染）。
   流式渲染期间指向 #liveHost —— 这是修一个很显眼的真机 bug：
   早先 setLive 每帧都 host.innerHTML = "" 以为清空了，
   但 addAct/addMsg/addToolGroup 全是往 #log 追加，那个清理清的是空壳；
   于是每次 revision 变化就把当前内容**再追加一份**到聊天区，
   流式期间思考块越堆越多（重新进会话时 renderHistory 会清空 #log，所以看着正常）。 */
var RENDER_INTO = null;
function sink() { return RENDER_INTO || log; }

function toast(m) {
  var t = $("toast");
  t.textContent = m;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(function () { t.classList.remove("show"); }, 1900);
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function atBottom() {
  return log.scrollHeight - log.scrollTop - log.clientHeight < 70;
}
function toBottom(force) {
  if (force || atBottom()) log.scrollTop = log.scrollHeight;
}

/* ── REST ── */
function api(path, method, body) {
  if (App && App.request) {
    /* 原生桥接是 request + poll 两段式：request 立刻给句柄（不阻塞 JS 线程，
       否则 WebView 滚动会跟着卡住），结果靠 poll 轮询取。
       这里把它包回 Promise，页面其余部分的 then/catch 写法不用动。 */
    var handle = App.request(path, method || "GET", body ? JSON.stringify(body) : null);
    return new Promise(function (resolve, reject) {
      var tries = 0;
      (function tick() {
        var raw = null;
        try { raw = App.poll(handle); } catch (e) { raw = null; }
        if (raw !== null && raw !== undefined) {
          var r;
          try { r = JSON.parse(raw); }
          catch (e) { reject(new Error("响应解析失败")); return; }
          if (r.status >= 200 && r.status < 300) {
            if (!r.text) { resolve(null); return; }
            try { resolve(JSON.parse(r.text)); }
            catch (e) { resolve(r.text); }
            return;
          }
          var msg = "HTTP " + (r.status || 0), code = r.code || "";
          try {
            if (r.body && r.body.error) {
              code = r.body.error.code || code;
              msg = r.body.error.message || msg;
            }
          } catch (e) {}
          var err = new Error(msg);
          err.code = code;
          reject(err);
          return;
        }
        if (++tries > 1200) { reject(new Error("请求超时")); return; }  /* ~2min */
        setTimeout(tick, 25);
      })();
    });
  }
  return fetch(API + path, {
    method: method || "GET",
    headers: (function () {
      var h = { Accept: "application/json", Authorization: "Bearer " + TOKEN };
      if (body) h["Content-Type"] = "application/json";
      return h;
    })(),
    body: body ? JSON.stringify(body) : undefined
  }).then(function (res) {
    if (!res.ok) {
      return res.text().then(function (raw) {
        var msg = "HTTP " + res.status, code = "";
        try {
          var b = JSON.parse(raw);
          if (b.error) { code = b.error.code || ""; msg = b.error.message || msg; }
        } catch (e) {}
        var err = new Error(msg);
        err.code = code;
        throw err;
      });
    }
    return res.status === 204 ? null : res.json();
  });
}

/* ── Markdown：自带实现，不依赖任何 CDN ──
   先把围栏代码块与行内代码抽出来占位，渲染完再放回去；
   否则代码里的 * _ # 会被当成强调与标题改写掉。 */
var FENCE = String.fromCharCode(96).repeat(3);
var TICK = String.fromCharCode(96);

function md(src) {
  var blocks = [], inl = [];
  var s = String(src == null ? "" : src);

  s = s.split(FENCE).join("@@FENCE@@");

  s = s.replace(/@@FENCE@@([A-Za-z0-9_+-]*)\n?([\s\S]*?)@@FENCE@@/g,
    function (m, lang, code) {
      blocks.push(code.replace(/\n$/, ""));
      return "@@CB" + (blocks.length - 1) + "@@";
    });

  s = s.split(TICK).join("@@TICK@@");
  s = s.replace(/@@TICK@@([^@@\n]+)@@TICK@@/g, function (m, c) {
    inl.push(c);
    return "@@IN" + (inl.length - 1) + "@@";
  });

  s = esc(s);

  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, function (m, a, u) {
    return /^https?:/i.test(u) ? '<img src="' + u + '" alt="' + a + '">' : a;
  });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');

  /* ── 表格 ──
   *
   * 真机才发现：早先 md() **压根没有表格**。而我回复里大量用表 ——
   * 手机端于是整段显示成原始竖线（截图里 | 项 | 之前 | 现在 | 那种），
   * 网页版却是正常表格，两边观感差得远。
   *
   * 处理方式与代码块同一套路：先把整块抽出来占位，最后统一生成 HTML。
   * 必须在这里抽：再往后就是 \n → <br> 那一步，表格行会被 <br> 拆散。
   */
  var tables = [];
  s = s.replace(
    /^[ \t]*\|[^\n]*\|[ \t]*\n[ \t]*\|[ \t]*:?-+:?[ \t]*(\|[ \t]*:?-+:?[ \t]*)*\|[ \t]*(?:\n[ \t]*\|[^\n]*\|[ \t]*)*/gm,
    function (block) {
      tables.push(block);
      return "\n@@TB" + (tables.length - 1) + "@@\n";
    }
  );

  s = s.replace(/^&gt;\s?(.*)$/gm, "<blockquote>$1</blockquote>");
  s = s.replace(/^\s{0,3}(#{1,6})\s+(.+)$/gm, function (m, h, t) {
    return "<h" + h.length + ">" + t.replace(/\*\*|__/g, "") + "</h" + h.length + ">";
  });
  s = s.replace(/^\s{0,3}([-*_])(\s*\1){2,}\s*$/gm, "<hr>");

  s = s.replace(/^\s{0,3}([*+-])\s+(.+)$/gm, "<li>$2</li>");
  s = s.replace(/^\s{0,3}(\d{1,9})[.)]\s+(.+)$/gm, "<li>$2</li>");
  s = s.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, "<ul>$1</ul>");

  s = s.replace(/(\*\*|__)(?=\S)([\s\S]*?\S)\1/g, "<strong>$2</strong>");
  s = s.replace(/(^|[^\w*])(\*|_)(\S(?:[\s\S]*?\S)?)\2(?=[^\w*]|$)/g, "$1<em>$3</em>");
  s = s.replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>");

  s = s.replace(/\n{2,}/g, "</p><p>");
  s = s.replace(/\n/g, "<br>");

  var html = "<p>" + s + "</p>";
  html = html.replace(/<p>\s*(<h[1-4]>[\s\S]*?<\/h[1-4]>)\s*<\/p>/g, "$1");
  html = html.replace(/<p>\s*(<ul>[\s\S]*?<\/ul>)\s*<\/p>/g, "$1");
  html = html.replace(/<p>\s*(<hr>)\s*<\/p>/g, "$1");
  html = html.replace(/<p>\s*(<blockquote>[\s\S]*?<\/blockquote>)\s*<\/p>/g, "$1");

  /* 表格必须**最先**展开。
   *
   * 单元格里可能带着 @@IN/@@CB 占位（行内代码、代码块都是先抽走的）。
   * 早先把 @@TB 放在最后：等它把表格 HTML 插进去时，@@IN/@@CB 那两步早就跑完了，
   * 单元格里的占位符于是原样漏到屏幕上 —— 真机截图里那一片 @@IN0@@ @@IN1@@ 就是它。
   * 先展开表格，再让 @@CB/@@IN 扫过整段（包括刚插进来的单元格内容），才收得住。 */
  html = html.replace(/@@TB(\d+)@@/g, function (m, i) {
    return mdTable(tables[+i]);
  });
  html = html.replace(/@@CB(\d+)@@/g, function (m, i) {
    return '<pre><button class="copy" onclick="cpy(this,' +
      JSON.stringify(blocks[+i]) + ')">复制</button><code>' +
      esc(blocks[+i]) + "</code></pre>";
  });
  html = html.replace(/@@IN(\d+)@@/g, function (m, i) {
    return "<code>" + esc(inl[+i]) + "</code>";
  });
  /* 表格是块级元素，不能裹在 <p> 里（外面那圈 <p>…</p> 由浏览器补正，
     会在表格前后留下一对空行）。把紧邻的段落包裹与 <br> 去掉。 */
  html = html.replace(/<p>\s*(?:<br>\s*)*(<div class="tw">[\s\S]*?<\/table><\/div>)(?:\s*<br>)*(?:\s*<\/p>)?/g, "$1");
  return html;
}

/* 拆一行表格：去掉首尾竖线，按 | 切列。 */
function mdCells(line) {
  var t = String(line == null ? "" : line).trim();
  if (t.charAt(0) === "|") t = t.slice(1);
  if (t.charAt(t.length - 1) === "|") t = t.slice(0, -1);
  return t.split("|").map(function (c) { return c.trim(); });
}

/* 把一个表格块变成 HTML。
   单元格内容在这里才 esc —— 抽取发生在转义之后，所以进到 cell 的文本
   已经带好了 @@IN/@@CB 占位与实体转义，直接拼即可。
   外面套 .tw：窄屏放不下的宽表横向滚，与卡片里的表格同一套样式。 */
function mdTable(block) {
  var lines = String(block).replace(/\n+$/, "").split("\n").filter(function (l) {
    return l.trim() !== "";
  });
  if (lines.length < 2) return "<p>" + lines.join("<br>") + "</p>";
  var head = mdCells(lines[0]);
  var rows = lines.slice(2).map(mdCells);
  var out = '<div class="tw"><table><thead><tr>';
  out += head.map(function (c) { return "<th>" + c + "</th>"; }).join("");
  out += "</tr></thead><tbody>";
  rows.forEach(function (r) {
    out += "<tr>";
    for (var i = 0; i < head.length; i++) {
      out += "<td>" + (r[i] == null ? "" : r[i]) + "</td>";
    }
    out += "</tr>";
  });
  return out + "</tbody></table></div>";
}

function cpy(btn, code) {
  var done = function () {
    btn.textContent = "已复制";
    setTimeout(function () { btn.textContent = "复制"; }, 1300);
  };
  if (navigator.clipboard && App && App.copy) { App.copy(code); done(); return; }
  if (navigator.clipboard) { navigator.clipboard.writeText(code).then(done, function () { toast("复制失败"); }); }
  else toast("复制失败");
}

/* ── 消息渲染 ── */
function dropEmpty() {
  var e = $("empty");
  if (e) e.parentNode.removeChild(e);
}
function addMsg(role, html, key) {
  dropEmpty();
  var w = document.createElement("div");
  w.className = "msg m-" + role;
  if (key) w.setAttribute("data-key", key);
    /* 标签靠各自那一侧：我的在右、DSH 在左，和气泡对齐。 */
  var lbl = role === "user" ? "我" : "DSH";
  w.innerHTML = '<div class="role">' + lbl + '</div><div class="bubble">' + html + "</div>";
  sink().appendChild(w);
  toBottom(true);
  return w;
}
function addUser(text, rid) {
  return addMsg("user", esc(text).replace(/\n/g, "<br>"), rid);
}
/* ── dsh-ui 围栏：在页面里就地切开 ──
 *
 * 为什么改主意、由页面自己认围栏：
 * 早先是原生用 splitMessageBody 把卡片抽出来、再通过 setCards 集中推给页面。
 * 那个做法有个治不好的结构性问题 —— 卡片被塞进消息流末尾的一个 host，
 * 而原文里的围栏在页面看来仍是一段普通代码块。于是同一张卡片显示两次：
 * 一次在底部，一次是原位的一坨灰底 JSON。用户看到的就是「卡片显示有问题」。
 *
 * 围栏判据与原生 splitMessageBody 保持一字不差（每条都对应一个踩过的坑）：
 *   ① 标记里含 dsh-ui（```dsh-ui 与 ```json dsh-ui 都认）；
 *   ② 只看行首的围栏头，正文里提到的 dsh-ui 不算；
 *   ③ 必须闭合，未闭合整段按原文保留（流式输出时不能切出半截 JSON）；
 *   ④ 空卡片不切。
 */
function isUiInfo(line) {
  if (line.indexOf(FENCE) !== 0) return false;
  var info = line.slice(FENCE.length).trim();
  if (!info) return false;
  return info.split(/[ \t]+/).some(function (w) { return w === 'dsh-ui'; });
}
function splitUi(src) {
  var body = String(src == null ? '' : src);
  var out = [];
  var cursor = 0;
  while (cursor < body.length) {
    var open = -1, pos = cursor;
    while (pos <= body.length) {
      var nl = body.indexOf('\n', pos);
      var end = nl < 0 ? body.length : nl;
      if (isUiInfo(body.slice(pos, end))) { open = pos; break; }
      if (nl < 0) break;
      pos = nl + 1;
    }
    if (open < 0) break;
    var headEnd = body.indexOf('\n', open);
    if (headEnd < 0) return [{ kind: 'prose', text: body }];
    var close = body.indexOf(FENCE, headEnd + 1);
    if (close < 0) return [{ kind: 'prose', text: body }];
    var before = body.slice(cursor, open).trim();
    if (before) out.push({ kind: 'prose', text: before });
    var json = body.slice(headEnd + 1, close);
    if (json.trim()) out.push({ kind: 'ui', json: json });
    var after = body.indexOf('\n', close + FENCE.length);
    cursor = after < 0 ? body.length : after + 1;
  }
  var rest = body.slice(cursor).trim();
  if (rest) out.push({ kind: 'prose', text: rest });
  return out.length ? out : [{ kind: 'prose', text: body }];
}

/* 流式期间把**尚未闭合的 dsh-ui 围栏**整段切掉。
 *
 * 不切的话：围栏闭合前它只是一段普通文本，会先以原始 JSON 代码块的形态显示一次，
 * 等闭合再变成卡片 —— 用户看到的就是「这里闪了一下」（真机截图里那个
 * {"title":"v2.2.9","gap":8,...）。节点复用治不了这个，因为内容本身换了形态。
 *
 * 与定稿渲染的取舍不同：那边未闭合整段保留（不能丢内容，宁可露出源码）；
 * 这边是流式中间态，藏起来比露出半截 JSON 好看。
 */
function stripOpenUiFence(text) {
  var body = String(text == null ? '' : text);
  var cursor = 0;
  while (cursor < body.length) {
    var open = -1, pos = cursor;
    while (pos <= body.length) {
      var nl = body.indexOf('\n', pos);
      var end = nl < 0 ? body.length : nl;
      if (isUiInfo(body.slice(pos, end))) { open = pos; break; }
      if (nl < 0) break;
      pos = nl + 1;
    }
    if (open < 0) return body;
    var headEnd = body.indexOf('\n', open);
    if (headEnd < 0) return body.slice(0, open).replace(/\s+$/, '');
    var close = body.indexOf(FENCE, headEnd + 1);
    if (close < 0) return body.slice(0, open).replace(/\s+$/, '');
    var after = body.indexOf('\n', close + FENCE.length);
    cursor = after < 0 ? body.length : after + 1;
  }
  return body;
}

/* 流式期间把**尚未成形的表格**切掉。
 *
 * 表格是逐行到达的：先是表头那行竖线、之后才来分隔行。
 * 分隔行没到之前它只是一行普通文本，会以原始竖线的样子先显示一次，
 * 分隔行一到就整块变成表格 —— 中间那一下就是用户说的「闪」。
 * 与未闭合围栏同理：成形前先不显示，成形后一次给出。
 *
 * 只认「行首就是竖线」的行，正文里随便出现的 a | b 不会被误伤。
 */
function stripOpenTable(text) {
  var lines = String(text == null ? '' : text).split('\n');
  var i = lines.length - 1;
  while (i >= 0 && /^\s*\|/.test(lines[i])) i--;
  if (i === lines.length - 1) return text;    /* 末尾不是表格行，不动 */
  var block = lines.slice(i + 1);
  /* 第二行必须是分隔行（|---|:--:| 这类）才算成形。 */
  var sep = block.length >= 2 ? block[1] : '';
  var formed = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(sep) && sep.indexOf('-') >= 0;
  if (formed) return text;
  return lines.slice(0, i + 1).join('\n').replace(/\s+$/, '');
}

/* 把一段助手正文填进**已有的** .bubble 里。
 *
 * 新建与就地更新共用同一个实现，是为了让流式渲染只换内容、不换节点 ——
 * 节点一换就要重新布局，屏幕上看就是「在同一位置不停地闪」。
 *
 * streaming=true（流式中间态）时，未闭合的围栏与未成形的表格都先藏起来，
 * 见 stripOpenUiFence / stripOpenTable。
 */
function fillAssistantBubble(bubble, text, streaming) {
  if (streaming) {
    text = stripOpenUiFence(text);
    text = stripOpenTable(text);
  }
  var segs = splitUi(text);
  var hasUi = segs.some(function (s) { return s.kind === 'ui'; });
  /* 没有卡片的常见情况：只有一个 .md 子节点时直接换它的 innerHTML，最省。 */
  if (!hasUi) {
    var only = bubble.querySelector('.md');
    if (only && bubble.children.length === 1) { only.innerHTML = md(text); return; }
    bubble.innerHTML = '<div class="md">' + md(text) + '</div>';
    return;
  }
  bubble.innerHTML = "";
  segs.forEach(function (s) {
    if (s.kind === 'ui') {
      var spec = null;
      try { spec = JSON.parse(s.json); } catch (e) { spec = null; }
      if (spec && typeof spec === 'object') {
        bubble.appendChild(renderCard(spec));
      } else {
        /* 解析失败：把原文放出来，不静默吞掉 —— 与原生「坏卡片回落」一致。 */
        var pre = document.createElement('pre');
        var code = document.createElement('code');
        code.textContent = s.json;
        pre.appendChild(code);
        bubble.appendChild(pre);
      }
    } else if (s.text) {
      var d = document.createElement('div');
      d.className = 'md';
      d.innerHTML = md(s.text);
      bubble.appendChild(d);
    }
  });
}

function addAssistantText(text, streaming) {
  dropEmpty();
  var w = document.createElement("div");
  w.className = "msg m-assistant";
  var head = document.createElement("div");
  head.className = "role";
  head.textContent = "DSH";
  w.appendChild(head);
  var bubble = document.createElement("div");
  bubble.className = "bubble";
  fillAssistantBubble(bubble, text, streaming);
  w.appendChild(bubble);
  sink().appendChild(w);
  toBottom(true);
  return w;
}
function newLiveBody(key) {
  dropEmpty();
  var w = document.createElement("div");
  w.className = "msg m-assistant";
  w.setAttribute("data-key", key);
  w.innerHTML = '<div class="role">DSH</div><div class="bubble md"></div>';
  sink().appendChild(w);
  toBottom(true);
  return w.querySelector(".bubble");
}
function newReasonBody() {
  dropEmpty();
  var d = document.createElement("details");
  d.className = "act";
  d.innerHTML = '<summary><span class="caret">▶</span><span>思考过程</span></summary><div class="body"></div>';
  sink().appendChild(d);
  toBottom(true);
  return d.querySelector(".body");
}

/* 流式气泡：服务端按 token 推 delta（带 turn/step/index），
   这里自己按四元组归并；turn 或 step 一变就另起一段，
   否则推理与正文会被揉进同一个气泡。 */
function liveDelta(d) {
  var key = d.sessionId + "/" + d.turn + "/" + d.step + "/" + (d.index || 0);
  var slot = pend[key];
  if (!slot) {
    slot = {
      buf: "",
      body: d.kind === "reasoning" ? newReasonBody() : newLiveBody(key)
    };
    pend[key] = slot;
  }
  slot.buf += d.text || "";
  if (d.kind === "reasoning") {
    slot.body.textContent = slot.buf;
  } else {
    slot.body.innerHTML = md(slot.buf);
  }
  toBottom();
}
function clearPend() { pend = {}; }

/* ── 事件数据读取：吃两种形状 ──
 *
 * 服务端那条路是 Kotlin → org.json。kotlinx 的 JsonElement 有时被当普通对象、
 * 有时被 quote 成**字符串**（org.json 遇到不认识的类型会写它的 toString()）。
 * 只认对象的话工具名会整片变空，动作摘要退化成「工具，工具结果」——
 * 真机上那一排排的组正是这个。两种都吃下。
 */
function evData(ev) {
  var d = ev && ev.data;
  if (typeof d === "string") {
    try { d = JSON.parse(d); } catch (e) { return {}; }
  }
  if (!d || typeof d !== "object") return {};
  /* 有的形状会再套一层 data。 */
  if (d.data && typeof d.data === "object" && !d.name && !d.content && !d.message) return d.data;
  return d;
}

/* 是不是「人发的」那条。历史与实时两条路共用同一判据。 */
function isRealUser(d) {
  return !!(d && d.source && d.source.kind === "user");
}

/* 工具名兜底：不同形状下它可能叫 name / tool / toolName / tool_name。 */
function toolNameOf(d) {
  if (!d || typeof d !== "object") return "";
  return d.name || d.tool || d.toolName || d.tool_name
    || (d.message && (d.message.name || d.message.toolName))
    || (d.call && d.call.name) || "";
}

/* 原始参数：动作摘要要扫它里面的内层工具名（tools.bash / tools.write …）。 */
function toolArgsRaw(d) {
  if (!d || typeof d !== "object") return "";
  var a = d.arguments != null ? d.arguments : (d.args != null ? d.args : d.input);
  if (typeof a === "string") return a;
  if (a && typeof a === "object") { try { return JSON.stringify(a); } catch (e) { return ""; } }
  return "";
}

/* 上一份 setLive 载荷。整份重画时要用，也留着给调试。 */
var lastLiveItems = null;

/* 是否显示「上下文注入」块（运行上下文 / 时间上下文 / 后台任务通知…）。
 * 由设置页控制，默认关 —— 用户：「没必要给我显示 上下文注入，手机端不看的」。
 * 这些块是系统每轮塞进来的，会在每条消息之间插一排折叠块，把正文挤得七零八落。 */
var showContext = false;
/* 记住最后一份历史，供开关切换时就地重画（不用等原生下一次推送）。 */
var lastHistory = null;
var lastLiveItems = null;

/* ── 流式思考条 ──
 *
 * 位置：消息区**下方**、输入区**上方**那条（原来挂诊断黄条的地方）。
 * 它是「运行状态」而不是「会话内容」，所以不进消息流 ——
 * 插在消息流里会随消息滚动、还会把内容挤开，也不好一眼看到。
 *
 * 行为：有思考就填一行（右侧省略号截断、只留最新的一段），没有就整条隐藏。
 * 完整的思考内容等这一轮结束后由历史里的「思考过程」折叠块承载。
 */
function setThinking(text) {
  var el = document.getElementById("thinkbar");
  if (!el) return;
  var t = String(text == null ? "" : text).replace(/\s+/g, " ").trim();
  if (!t) { el.hidden = true; return; }
  /* 只留尾部：思考是往前推进的，最新的一段才有信息量。 */
  if (t.length > 140) t = "…" + t.slice(-140);
  var tt = el.querySelector(".tt");
  if (tt) tt.textContent = t;
  el.hidden = false;
}
function clearThinking() {
  var el = document.getElementById("thinkbar");
  if (!el) return;
  el.hidden = true;
  var tt = el.querySelector(".tt");
  if (tt) tt.textContent = "";
}

/* 折叠块：工具调用 / 工具结果 / 上下文注入 */
function addAct(label, text) {
  dropEmpty();
  var d = document.createElement("details");
  d.className = "act";
  d.innerHTML = '<summary><span class="caret">▶</span><span>' + esc(label) +
    '</span></summary><div class="body">' + esc(text || "") + "</div>";
  sink().appendChild(d);
  return d;
}

/* 系统注入的上下文该挂什么名头。
 *
 * 这些事件的 source.kind 是分类依据：runtime-context 是每轮都塞进来的运行快照，
 * time-context 是时间戳，tool-jobs / subagent-settled 是后台与子代理的通知…
 * 给它们一个人能读的名字，折叠块才不至于全叫「上下文注入」。
 * 与原生 ChatPresentation.contextLabel 覆盖同一批 kind。 */
function contextLabel(source) {
  if (!source || typeof source !== 'object') return '上下文注入';
  var k = String(source.kind || '');
  if (!k) return '上下文注入';
  var map = {
    'runtime-context': '运行上下文',
    'time-context': '时间上下文',
    'tool-jobs': '后台任务',
    'subagent-settled': '子代理完成',
    'model-selection': '模型选择',
    'skill-catalog': '技能清单',
    'compact-checkpoint': '上下文压缩点',
    'agent-instructions': '智能体指令',
    'session-reference': '会话引用'
  };
  if (map[k]) return map[k];
  if (k === 'skill-invocation') return '技能' + (source.name ? ' · ' + source.name : '');
  /* 插件注入的 kind 形如 plugin:dsh-mneme / plugin:@scope/name */
  if (k.indexOf('plugin') === 0) {
    var p = k.replace(/^plugin:?/, '');
    return '插件上下文' + (p ? ' · ' + p : '');
  }
  return k;
}

/* ── 工具调用：整组折叠 ──
 *
 * 早先是每次调用、每个结果各占一个折叠块 —— 一轮对话下来就是几百个块，
 * 翻历史像在翻日志，用户的原话是「太乱」。
 * 现在**连续的工具事件合成一组**：组头只报次数与工具名摘要，
 * 组内每条只占一行（工具名 + 参数预览 + 成败），要点开才看完整参数与结果。
 */

/* 参数预览：挑一个最有信息量的字段，压成一行。
   把整坨 JSON 塞进标题会把行撑爆，也读不出重点。 */
function toolArgSummary(args) {
  var raw = String(args == null ? '' : args);
  if (!raw.trim()) return '';
  var s = raw;
  try {
    var o = JSON.parse(raw);
    if (o && typeof o === 'object') {
      var keys = ['command', 'file_path', 'path', 'pattern', 'query', 'url', 'prompt', 'text', 'code'];
      for (var i = 0; i < keys.length; i++) {
        if (typeof o[keys[i]] === 'string' && o[keys[i]].trim()) { s = o[keys[i]]; break; }
      }
    }
  } catch (e) {}
  s = s.replace(/\s+/g, ' ').trim();
  return s.length > 72 ? s.slice(0, 72) + '…' : s;
}

/* 组内一条：默认只占一行，点开看参数与结果。 */
function toolEntry(e) {
  var d = document.createElement('details');
  d.className = 'ti';
  var sum = document.createElement('summary');
  var st = e.isError ? '<span class="tst err">失败</span>'
    : (e.hasResult ? '<span class="tst ok">✓</span>' : '');
  sum.innerHTML = '<span class="caret">▶</span>' +
    '<span class="tn">' + esc(e.name || '工具') + '</span>' +
    '<span class="ta1">' + esc(e.arg || '') + '</span>' + st;
  d.appendChild(sum);
  var body = document.createElement('div');
  body.className = 'tbody';
  if (e.argsFull && e.argsFull !== e.arg) {
    var a = document.createElement('pre');
    a.className = 'targs';
    a.textContent = e.argsFull;
    body.appendChild(a);
  }
  if (e.hasResult) {
    var r = document.createElement('div');
    r.className = 'tres' + (e.isError ? ' err' : '');
    r.textContent = e.result || '';
    body.appendChild(r);
  }
  d.appendChild(body);
  return d;
}

/* 就地重填一个已存在的工具组：只换内部列表与汇总行，不换 details 节点本身。
   流式期间工具条目会一条条增加，重建整个节点会让这一块闪。 */
function refillToolGroup(el, entries) {
  var names = toolGroupSummary(entries);
  var head = el.querySelector('summary');
  if (head) {
    var tn = head.querySelector('.tnames');
    if (tn) tn.textContent = names.slice(0, 90);
  }
  var list = el.querySelector('.tlist');
  if (!list) return;
  list.innerHTML = '';
  entries.forEach(function (e) { list.appendChild(toolEntry(e)); });
}

/* 一组工具调用。entries: {name, arg, argsFull, result, hasResult, isError} */
/* ── 工具动作的「人话」措辞 ──
 *
 * 网页版报的是「运行了代码，已写入文件，执行了命令」这种动作摘要，不是工具名。
 * 判据来自**真实数据**：run_code 的 arguments 里能看到它调了哪些内层工具。
 * 全量统计那份会话的 1129 次 run_code ——
 *   tools.bash 748、tools.edit 158、tools.read 116、tools.write 53；
 *   其中 bash+write 这一组合 42 例，对应的正是「运行了代码，已写入文件，执行了命令」。
 * 所以这不是猜的编法，是照着一字不差还原。
 */
/* 顺序按官方措辞对齐：edit 在 write 之前 —— 官方那句是
   「运行了代码，修改了文件，已写入文件等」。 */
var INNER_ACTIONS = [
  ['tools.edit',  '修改了文件'],
  ['tools.write', '已写入文件'],
  ['tools.read',  '读取了文件'],
  ['tools.bash',  '执行了命令'],
  ['tools.grep',  '搜索了内容'],
  ['tools.glob',  '搜索了文件'],
  ['tools.mcp',   '调用了 MCP 工具'],
];

/* 单个工具调用 → 动作短语数组。args 是原始 arguments 字符串（拿不到就只按工具名给）。 */
function toolActions(name, args) {
  var n = String(name == null ? '' : name);
  var raw = String(args == null ? '' : args);
  var out = [];
  if (n === 'run_code') {
    out.push('运行了代码');
    INNER_ACTIONS.forEach(function (pair) {
      if (raw.indexOf(pair[0]) >= 0 && out.indexOf(pair[1]) < 0) out.push(pair[1]);
    });
    return out;
  }
  var byName = {
    bash: '执行了命令', read: '读取了文件', write: '已写入文件', edit: '修改了文件',
    grep: '搜索了内容', glob: '搜索了文件', ls: '列了目录', task: '跑了子任务'
  };
  if (byName[n]) return [byName[n]];
  if (n.indexOf('mcp__') === 0) return ['调用了 ' + n.replace(/^mcp__/, '').replace(/__/g, ' · ')];
  return [n || '工具'];
}

/* 一整组工具 → 一句话动作摘要：按首次出现顺序去重，超过 4 个收尾加「等」。 */
function toolGroupSummary(entries) {
  var acts = [];
  (entries || []).forEach(function (e) {
    toolActions(e.name, e.argsFull).forEach(function (a) {
      if (acts.indexOf(a) < 0) acts.push(a);
    });
  });
  if (!acts.length) return '';
  if (acts.length > 4) return acts.slice(0, 4).join('，') + '等';
  return acts.join('，');
}

function addToolGroup(entries) {
  if (!entries || !entries.length) return null;
  dropEmpty();
  var names = toolGroupSummary(entries);
  var d = document.createElement('details');
  d.className = 'act tools';
  var head = document.createElement('summary');
  /* 表头只报动作，不再报「工具调用 N 次」—— 用户：「显示了运行了代码、修改了文件，
     就没必要显示工具调用 x 次了」。次数是给日志看的，上面那句才是给人看的。 */
  head.innerHTML = '<span class="caret">▶</span>' +
    '<span class="tnames">' + esc(names.slice(0, 90)) + '</span>';
  d.appendChild(head);
  var list = document.createElement('div');
  list.className = 'tlist';
  entries.forEach(function (e) { list.appendChild(toolEntry(e)); });
  d.appendChild(list);
  sink().appendChild(d);
  toBottom();
  return d;
}

/* 审批卡 */
function addApproval(a) {
  dropEmpty();
  var w = document.createElement("div");
  w.className = "approve";
  w.setAttribute("data-approval", a.id);
  w.innerHTML =
    '<div class="hd">⚠ 需要审批</div>' +
    '<div>' + esc(a.toolName || "工具调用") +
    (a.reason ? " · " + esc(a.reason) : "") + "</div>" +
    (a.detail ? '<div class="cmd">' + esc(a.detail) + "</div>" : "") +
    '<div class="btns">' +
    '<button class="no">拒绝</button>' +
    '<button class="yes"' + (canWrite ? "" : " disabled") + ">允许一次</button></div>";
  w.querySelector(".no").onclick = function () { decide(a.id, false, w); };
  w.querySelector(".yes").onclick = function () { decide(a.id, true, w); };
  sink().appendChild(w);
  toBottom(true);
}
function decide(id, allow, node) {
  if (!canWrite) { toast("设备没有 chat.write 权限"); return; }
  api("/chat/sessions/" + encodeURIComponent(SID) + "/approvals/" +
      encodeURIComponent(id) + "/decision", "POST",
      { outcome: allow ? "allowed-once" : "rejected" })
    .then(function () {
      if (node) node.parentNode.removeChild(node);
      toast(allow ? "已允许一次" : "已拒绝");
    })
    .catch(function (e) { toast("审批失败：" + e.message); });
}

/* ── 问答卡（ask_user_question，方案 A：只认 continued）──
 *
 * 外形与审批卡共用 `.approve`（见上面的样式注释）。
 *
 * 数据**两条路**进来，与审批完全对称：
 *   ① 原生 setQuestions 推（原生那份只含当前会话）；
 *   ② 页面自己 GET（init 与几条 WS 事件之后，见 refreshQuestions）。
 * 两条路都按 callId 去重（页面节点上的 data-question），先到先画，不会画两张。
 *
 * 选项的 label 一律**不进 DOM 属性**，只放数字下标（data-i / data-j）——
 * 提交时再去 set.questions 里取原值。这样任何引号/尖括号都伤不到选择器，
 * 也不必给选择器写 CSS 转义。
 */
function addQuestion(set) {
  if (!set || !set.callId) return;
  if (log.querySelector('[data-question="' + set.callId + '"]')) return;
  dropEmpty();
  var w = document.createElement("div");
  w.className = "approve ask";
  w.setAttribute("data-question", set.callId);
  var qs = set.questions || [];
  var html = '<div class="hd">❓ 需要你的回答</div>';
  qs.forEach(function (q, i) {
    html += '<div class="q">';
    if (q.header) html += '<div class="qh">' + esc(q.header) + '</div>';
    html += '<div class="qt">' + esc(q.question || '') + '</div>';
    if (q.detail) html += '<div class="qd">' + esc(q.detail) + '</div>';
    var opts = q.options || [];
    if (opts.length) {
      opts.forEach(function (o, j) {
        html += '<label class="opt"><input type="' + (q.multiSelect ? 'checkbox' : 'radio') +
          '" data-i="' + i + '" data-j="' + j + '"><span>' + esc(o.label) +
          (o.description ? '<em>' + esc(o.description) + '</em>' : '') + '</span></label>';
      });
    } else {
      /* 没有选项 = 这题要自由文本，正好对应协议里的 custom。 */
      html += '<textarea class="custom" data-i="' + i + '" rows="2" placeholder="填写你的回答"></textarea>';
    }
    html += '</div>';
  });
  html += '<div class="btns"><button class="yes">提交回答</button></div>';
  w.innerHTML = html;
  if (set.answered) {
    markQuestionAnswered(w);
  } else {
    var btn = w.querySelector('.yes');
    btn.onclick = function () { submitQuestion(set, w, btn); };
  }
  sink().appendChild(w);
  toBottom(true);
  return w;
}

function markQuestionAnswered(node) {
  node.setAttribute("data-answered", "1");
  node.removeAttribute("data-busy");   /* 提交中flag不留：以后再推同一组也不该显示"提交中" */
  var btns = node.querySelector(".btns");
  if (btns && btns.parentNode) btns.parentNode.removeChild(btns);
  var inputs = node.querySelectorAll("input,textarea");
  for (var i = 0; i < inputs.length; i++) inputs[i].disabled = true;
  var hd = node.querySelector(".hd");
  if (hd) { hd.className = "hd done"; hd.textContent = "✓ 已回答"; }
}

function submitQuestion(set, node, btn) {
  if (!canWrite) { toast("设备没有 chat.write 权限"); return; }
  if (node.getAttribute("data-busy") === "1") return;   /* 防重复提交第一道闸（插件的 409 是第二道） */
  var qs = set.questions || [];
  var picked = {};
  var inputs = node.querySelectorAll("input");
  for (var k = 0; k < inputs.length; k++) {
    if (!inputs[k].checked) continue;
    var i0 = +inputs[k].getAttribute("data-i");
    if (!picked[i0]) picked[i0] = [];
    var opt = (qs[i0] && qs[i0].options && qs[i0].options[+inputs[k].getAttribute("data-j")]) || null;
    if (opt) picked[i0].push(opt.label);
  }
  var answers = [];
  var complete = true;
  qs.forEach(function (q, i) {
    var opts = q.options || [];
    if (opts.length) {
      var chosen = [];
      opts.forEach(function (o) { if ((picked[i] || []).indexOf(o.label) >= 0) chosen.push(o.label); });
      if (!chosen.length) complete = false;
      answers.push({ id: q.id, selected: chosen });
    } else {
      var ta = node.querySelector('textarea[data-i="' + i + '"]');
      var text = ta ? String(ta.value || "").replace(/^\s+|\s+$/g, "") : "";
      if (!text) complete = false;
      answers.push({ id: q.id, selected: [], custom: text });
    }

  node.setAttribute("data-busy", "1");
  btn.disabled = true;
  btn.textContent = "提交中…";
  api("/chat/sessions/" + encodeURIComponent(SID) + "/questions/" + encodeURIComponent(set.callId) + "/answer",
      "POST", { answers: answers })
    .then(function () {
      markQuestionAnswered(node);
      toast("已回答");
    })
    .catch(function (e) {
      node.removeAttribute("data-busy");
      btn.disabled = false;
      btn.textContent = "提交回答";
      toast(questionError(e));
    });
}

/* 提交失败的文案：409 的两种 code 含义完全不同（答过了 / 这条作废了），
   原样甩 code 用户既看不懂，也不知道该不该重试。 */
function questionError(e) {
  var code = (e && e.code) || "";
  var msg = (e && e.message) || "";
  if (code === "QUESTION_REPLY_QUEUED") return "这组问题你已经回答过了，答复正在排队";
  if (code === "QUESTION_NOT_PENDING") return "这组问题已经不需要回答了";
  if (code === "FORBIDDEN" || code === "SCOPE_MISSING" || msg.indexOf("chat.write") >= 0) {
    return "这台设备没有 chat.write 权限";
  }
  return "提交失败：" + (msg || "未知错误");
}

/* 页面自己那一路：只对**当前会话** SID 发，绝不遍历会话列表 ——
   插件的 resolveAgent 是 resolve-or-resume，对冷会话会把那边的 agent 拉活。 */
function refreshQuestions() {
  if (!SID) return Promise.resolve();
  return api("/chat/sessions/" + encodeURIComponent(SID) + "/questions")
    .then(function (r) {
      ((r && r.items) || []).forEach(function (s) {
        if (!s || s.state !== "continued") return;
        addQuestion(s);
      });
    })
    .catch(function () {});
}

/* ── 历史归约 ──
   REST 历史是 DSH 原始事件流：user/message 与 assistant/message 已定稿，
   assistant/chunk 需按 (turn,step,index) 累积后再成段。 */
/* 按**段类型**取文字。
 *
 * 为什么必须分开取：早先这里把 text 与 reasoning 一起收了，结果是
 * 「思考过程」被当成正文灌进聊天气泡——用户看到我一大段英文内部推理直接铺在会话里。
 * 原生的做法是分开的：reasoning 进「思考过程」折叠块，只有 text 进正文。
 * 所以这里按 want 参数各取各的，调用方决定往哪儿放。
 */
function partsText(c, want) {
  if (c == null) return "";
  if (typeof c === "string") return want === "text" ? c : "";
  if (!Array.isArray(c)) return "";
  return c.map(function (p) {
    if (typeof p === "string") return want === "text" ? p : "";
    if (!p || typeof p !== "object") return "";
    if (p.type !== want) return "";
    return typeof p.text === "string" ? p.text : "";
  }).filter(function (s) { return s.trim() !== ""; }).join("\n\n");
}

/* 正文：只认 text 段。拼接规则与原生 ChatPresentation.contentText 一致
   （空段丢掉、段间空行）。 */
function contentText(c) {
  return partsText(c, "text");
}

/*
 * 取一条事件的正文。
 *
 * 旧版只有 typeof d.message === "string" 那一支，而真实历史里 assistant/message 的
 * 形状是 data.message = { role, content:[{type,text}] } —— 是**对象**不是字符串，
 * 于是全部落空，界面只剩工具调用/工具结果，正文一条都没有。
 * 用真实会话日志离线核过：745 条助手消息，旧实现提取出 0 条。
 * 现在递归下降一层，并处理 d.content 本身就是数组的情况（user/message 就是）。
 */
function pickText(d) {
  if (typeof d === "string") return d;
  if (!d || typeof d !== "object") return "";
  if (typeof d.text === "string" && d.text) return d.text;

  if (d.message && typeof d.message === "object") {
    var t = contentText(d.message.content);
    if (t) return t;
  }
  if (typeof d.message === "string") return d.message;

  if (Array.isArray(d.content)) {
    var t2 = contentText(d.content);
    if (t2) return t2;
  }
  if (typeof d.content === "string") return d.content;
  if (typeof d.body === "string") return d.body;
  if (Array.isArray(d.parts)) {
    return d.parts.map(function (p) {
      if (typeof p === "string") return p;
      return p && typeof p.text === "string" ? p.text : "";
    }).join("");
  }
  return "";
}
function renderHistory(hist) {
  RENDER_INTO = null;   /* 历史渲染一律落回 #log */
  clearThinking();      /* 思考条是流式状态，看历史时不该留着 */

  /* 整块重画。这是**唯一**的渲染路径 ——
   * 正文、工具、上下文、用户消息全在这里，不再有第二套「实时区」跟它抢着画。
   * 用户原话：「发出来的就当做历史对待，别自己替换了」。 */
  log.innerHTML = "";
  pend = {};
  var evs = (hist && hist.events) || [];
  var chunks = {}, order = [];

  /* 正文为空的事件一律跳过。
     assistant/message 里有一类是 content 纯 [tool-call]，本来就没有正文，
     不跳的话界面上会留下一串只有标题、没有内容的空「DSH」气泡。 */
  function addIfText(fn, d) {
    var t = pickText(d);

  /* 工具事件先攒着，遇到非工具事件再一次性落地成一组。

  var toolRun = [];
  function flushTools() {
    flushThink();

  /* 思考也攒着：一个回合里有多个 step，每个 step 的思考各成一块的话，
     流式期间就会看到一长串「思考过程」（真机截图里连着八个）。
     连续到达的思考合成一块，遇到别的内容再落地。 */
  var thinkRun = [];
  function flushThink() {
    if (!thinkRun.length) return;
    addAct("思考过程", thinkRun.join("\n\n"));

  }

  evs.forEach(function (e) {
    var ev = e.event || e;
    var d = evData(ev);
    /* 只有**会渲染出可见内容**的事件才断开工具组。

     * 早先是「任何非工具事件都断开」，结果 step/start、step/end 这类纯结构事件，
     * 以及那些只含 tool-call、没有正文的 assistant/message，全把组冲断了 ——
     * 分组形同虚设（实测 1771 个工具事件只降到 1739 组，白干）。
     * 现在改成：只有真的要往界面上写字时才收组。 */
    if (ev.type !== "tool/call" && ev.type !== "tool/result") {

       *   reasoning ——— 算了的话连续两次思考互相冲断，又成一长串「思考过程」；
       *   上下文注入 —— 系统每轮都塞。算了就会把一整串连续的工具调用切碎成

       *     （用户截图）。它是环境噪音，不是内容。
       *   注入型 user/message —— 同上，只有 source.kind === "user" 才是人说的。
       * assistant/message 也不在这里判：它的思考与正文要按顺序一起处理。 */
      var visible = ev.type === "user/message" && isRealUser(d);
      if (visible) flushTools();
    }
    if (ev.type === "user/message") {
      /* 只有 source.kind === "user" 才是**用户真的发出去的**。
       *
       * user/message 这个事件类型里混着大量系统注入：运行上下文、时间上下文、
       * 后台任务通知、子代理完成、模型选择、技能清单、上下文压缩点…
       * 早先不判断一律渲染成蓝色用户气泡 —— 用户每次进会话都看见一大片
       * 「自己发过、其实没发」的东西（那份真实会话里 200 条 user/message，
       * 只有 57 条是用户发的，其余 143 条全是注入）。
       * 与原生 ChatPresentation.userItems 的判据保持一致：非 user 的收进折叠块。 */
      var srcKind = (d.source && d.source.kind) ? String(d.source.kind) : "";
      if (srcKind === "user") {
        addIfText(addUser, d);
      } else if (showContext) {
        addIfText(function (t) { addAct(contextLabel(d.source), t); }, d);
      }
    } else if (ev.type === "assistant/message") {
      /* reasoning 与 text 必须**分开**：前者进「思考过程」折叠块，后者才是正文。
         早先统一走 pickText，而 pickText 里把两种段一起取了，
         结果我的内部推理被当成正文整段灌进聊天气泡（真机截图里的那一大段英文）。 */
      var mc = (d.message && typeof d.message === "object" && d.message.content) || d.content;
      var body = partsText(mc, "text");
      /* 这里的 reasoning 段**刻意不取** —— 历史里不再显示思考过程（见上）。
         partsText(mc, "text") 只取 text 段，正是为了不让推理混进正文。 */
      if (body && body.trim()) {
        flushThink();
        flushTools();
        addAssistantText(body);
      }
    } else if (ev.type === "assistant/chunk") {
      var k = d.turn + "/" + d.step + "/" + (d.index || 0);
      if (!chunks[k]) { chunks[k] = { kind: d.kind, text: "" }; order.push(k); }
      chunks[k].text += d.text || "";
    } else if (ev.type === "tool/call") {
      flushThink();   /* 思考落在工具之前，顺序才对 */
      /* 只入队，不立刻渲染 —— 连续多次调用会合成一个组。 */
      toolRun.push({
        callId: d.callId || d.id || '',
        name: toolNameOf(d),
        arg: toolArgSummary(d.arguments),
        argsFull: toolArgsRaw(d),
      });
    } else if (ev.type === "tool/result") {
      flushThink();
      /* 按 callId 回填到对应的那一条；找不到就单独成条，不丢内容。 */
      var mid = (d.message && d.message.toolCallId) || d.toolCallId;
      var txt = pickText(d);
      var isErr = !!(d.message && d.message.isError);
      var hit = null;
      for (var x = toolRun.length - 1; x >= 0; x--) {
        if (mid && toolRun[x].callId === mid) { hit = toolRun[x]; break; }
      }
      if (hit) {
        hit.result = txt;
        hit.hasResult = true;
        hit.isError = isErr;
      } else {
        toolRun.push({ name: "工具结果", arg: "", result: txt, hasResult: true, isError: isErr });
      }
    } else if (ev.type === "reasoning") {
      /* 历史里的思考过程**不再渲染** —— 用户：
         「历史会话没必要显示思考过程了，没人看的」。
         实时那条思考行（#thinkbar）保留：那是运行状态，与这里不是一回事。 */
      return;
    } else if (ev.type === "context/injected" || ev.type === "context") {
      if (showContext) addIfText(function (t) { addAct("上下文注入", t); }, d);
    }
  });

  flushTools();   /* 收尾：末尾还攒着的那组也要落地，否则整段工具调用凭空消失 */

  /* assistant/chunk 也是同一个道理：连续几段 reasoning 合并成一块。 */
  order.forEach(function (k) {
    var c = chunks[k];
    if (!c.text) return;
    if (c.kind === "reasoning") return;   /* 历史不显示思考过程 */
    flushThink();
    addAssistantText(c.text);
  });
  flushThink();
  flushTools();


  if (!log.children.length) {
    var em = document.createElement("div");
    em.id = "empty";
    em.textContent = "这个会话还没有消息，发一条试试。";
    log.appendChild(em);
  }
  toBottom(true);
  renderTodosFrom(hist);
}

function renderTodosFrom(hist) {

/* ── 运行状态 ── */
function setRunning(on) {
  running = !!on;
  $("stop").disabled = !on;
  $("steer").disabled = !on || !canWrite;
  /* 占位符必须短到一行放得下。
     早先写的是「输入消息…  Enter 发送 / Shift+Enter 换行」，在 346px 宽的窄屏上
     被撑成两行，而输入框只有一行多的高度 —— 第二行直接被裁掉，看着像残字。
     何况手机上有发送按钮，Enter/Shift+Enter 那套是桌面习惯，本来就多余。 */
  ta.placeholder = running ? "运行中… 发送即插话" : "输入消息…";
  $("send").disabled = !ta.value.trim() || !canWrite;
}

/* ── WebSocket：只认当前会话的事件 ──
   delta 是 token 级，落定由 chat.message.committed 收束；
   服务端不给回放，所以重连后一律重新拉 REST 历史。 */
function connectWS() {
  if (!API) return;
  if (ws) { try { ws.close(); } catch (e) {} }
  var sock;
  try {
    sock = new WebSocket(API.replace(/^http/, "ws") + "/events");
  } catch (e) { scheduleReconnect(); return; }
  ws = sock;

  sock.onopen = function () { wsRetry = 0; $("dot").className = "on"; };
  sock.onclose = function () { $("dot").className = "off"; scheduleReconnect(); };
  sock.onerror = function () { try { sock.close(); } catch (e) {} };
  sock.onmessage = function (m) {
    var ev;
    try { ev = JSON.parse(m.data); } catch (e) { return; }
    if (!ev) return;

    if (ev.type === "connection.ready") { $("dot").className = "on"; return; }
    if (ev.sessionId && SID && ev.sessionId !== SID) return;

    var d = ev.data || {};
    switch (ev.type) {
      case "chat.message.delta":
        liveDelta(d);
        setRunning(true);
        break;
      case "chat.message.committed":
        clearPend();
        break;
      case "chat.session.status":
        setRunning(d.running === true || d.status === "running");
        refreshQuestions();
        break;
      /* 问题多半出现在一轮中间，这几类事件就是「这一轮结构变了」的信号 ——
         与原生 refreshPendingQuestions 挂在同一批事件上，两处口径保持一致。 */
      case "chat.turn.start":
      case "chat.turn.end":
        refreshQuestions();
        break;
      case "chat.approval.requested":
      case "chat.approval.resolved":
        refreshApprovals();
        refreshQuestions();
        break;
      default:
        break;
    }
  };
}
function scheduleReconnect() {
  if (closed) return;
  var wait = Math.min(30000, 500 * Math.pow(2, wsRetry++));
  setTimeout(connectWS, wait);
}
window.addEventListener("pagehide", function () { closed = true; });

/* ── 刷新 ── */
/*

 * 「正在读取会话…」：init 压根没发到（原生 LaunchedEffect 早退）／init 发了但
 * sessionId 为空／没连上任何电脑／请求发出但没回。四条路径在界面上不可区分，

 *

 * 真机复现一次，把这行字念给我，根因一次到位。

var __diag = [];

     留着就是走不到的死代码，还会让「引用的 id 是否都存在」这项体检报红。 */
  try { console.log('[dsh] ' + line); } catch (e) {}

function showFatal(text, detail) {

function refreshHistory() {

/* ── 发送 ── */
function rid() {

  /* 单个节点的渲染逻辑单独成函数：表格里也能嵌组件（状态列的 badge、

      : '';
    return '<span class="a' + (a.busy ? ' busy' : '') + '" data-id="' + esc(a.id) + '">' +
      thumb + '<span class="nm">' + esc(a.name || '文件') + '</span>' +
      (a.busy ? '<span>…</span>' : '') +
      '<button class="x" data-x="' + esc(a.id) + '">×</button></span>';
  }).join('');
  box.querySelectorAll('[data-x]').forEach(function (b) {
    b.onclick = function () {
      ATTS = ATTS.filter(function (a) { return a.id !== b.getAttribute('data-x'); });
      renderAtts();
    };
  });
}

/* 全局只允许一个「等文件」的任务。早先每点一次 + 就起一条 50 秒的轮询链，
   连点几次就是几条并行链同时问 takeAttachment —— 而原生那边只有一个
   pendingUri 槽位，先返回的那条会把它吃掉，后面的链永远等不到。
   表现为「选了文件，界面半天没反应」或「有时能选有时不能」。 */
var attWait = null;

function addAtt(kind, accept) {
  if (!App || !App.pickFile) { toast('这个版本不支持附件'); return; }
  if (attWait) { toast('还在等你选文件'); return; }

  var started = App.pickFile(kind === 'image' ? 'image/*' : (accept || '*/*'));
  if (started === false) { toast('无法打开文件选择器'); return; }

  /* 取字节的等待：原生不提供取消信号，只能轮询。
     上限 8 秒：选择器里慢慢挑文件可以，但无限轮询会在用户已经点了取消、
     甚至已经关页之后仍然在跑，白白浪费电量。 */
  var tries = 0;
  var MAX = 32;               /* 32 x 250ms = 8s */
  attWait = setInterval(function () {
    var raw = null;
    try { raw = App.takeAttachment(); } catch (e) { stopWait(true); return; }

    /* 一律 JSON.parse 后看字段，不再用 indexOf 匹配字符串。

       早先用 raw.indexOf('"ok":false,"error"') 判断失败，依赖了 **字段顺序**：
       Android 的 JSONObject 不保证插入顺序，一旦变成 {"error":…,"ok":false} 就误判为「还没选」，
       页面继续轮询到超时，用户等进一个错误提示。 */
    var obj = null;
    try { obj = raw ? JSON.parse(raw) : null; } catch (e) { obj = null; }

    if (obj && obj.ok === true) {
      stopWait(false);
      pushAtt(obj);
      return;
    }
    if (obj && obj.ok === false && obj.error) {
      stopWait(true);
      toast(obj.error);
      return;
    }
    if (++tries > MAX) { stopWait(true); toast('未选择文件'); }
  }, 250);

  function stopWait(silent) {
    if (attWait) { clearInterval(attWait); attWait = null; }
  }

  function pushAtt(a) {
    var isImg = /^image\//.test(a.type || '');
    var att = {
      id: 'a-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      kind: isImg ? 'image' : 'file',
      name: a.name, size: a.size, type: a.type, data: a.data,
      busy: !isImg,
    };
    ATTS.push(att);
    renderAtts();
    if (!isImg) uploadAtt(att);
  }
}

function uploadAtt(a) {
  if (!SID) return;
  api('/chat/sessions/' + encodeURIComponent(SID) + '/attachments', 'POST', {
    name: a.name,
    data: a.data,
  }).then(function (r) {
    a.receiptId = (r && (r.receiptId || r.id)) || '';
    a.busy = false;
    renderAtts();
  }).catch(function (e) {
    a.busy = false;
    ATTS = ATTS.filter(function (x) { return x.id !== a.id; });
    renderAtts();
    toast('上传失败：' + e.message);
  });
}

/* 发送时按服务端期望的形状组装。原生 PromptPart 有三种：
   text / image（内联 base64）/ file（引用 receiptId）。 */
function buildParts(text) {
  var parts = [];
  if (text) parts.push({ type: 'text', text: text });
  ATTS.forEach(function (a) {
    if (a.kind === 'image') {
      parts.push({ type: 'image', mediaType: a.type || 'image/png', data: a.data, name: a.name });
    } else if (a.receiptId) {
      parts.push({ type: 'file', receiptId: a.receiptId });
    }
  });
  return parts;
}

/* ── 对外接口：App 通过 evaluateJavascript 调这些 ── */
window.dshChat = {
  init: function (cfg) {
    /* 先回报原生，再做任何别的事。
       原生靠这条回执判断 evaluateJavascript 到底有没有送达 ——
       它是单向的，没有回执时「发早了」和「没发」在界面上完全无法区分。 */
    try { if (App && App.pageReady) App.pageReady(); } catch (e) {}
    note("init 已收到", "sid=" + (cfg.sessionId || "空"));
    API = String(cfg.apiBase || "").replace(/\/+$/, "");
    TOKEN = cfg.token || "";
    SID = cfg.sessionId || "";
    if (!SID) note("init 里没有 sessionId —— 原生没选中会话");
    canWrite = !cfg.scopes || cfg.scopes.indexOf("chat.write") >= 0;
    $("title").textContent = cfg.title || SID || "会话";
    $("warn").textContent = cfg.warn || "";
    $("warn").style.display = cfg.warn ? "" : "none";
    if (cfg.todos) setTodos(cfg.todos);
    setRunning(!!cfg.running);
    window.__lastCfg = cfg;
    if (cfg.onLive !== false) {
      note("开始拉取");
      loadCommands()
        .then(function () { note("命令已载入"); })
        .then(function () { return refreshHistory(); })
        .then(function () { note("历史已载入"); })
        .then(function () { return refreshApprovals(); })
        .then(function () { return refreshQuestions(); })
        .then(connectWS)
        .catch(function (e) {
          /* 到这一步说明连 loadCommands 都挂了（多半是没连上电脑），
             显示成失败态而不是永远转圈。 */
          note("拉取失败", e.message);
          if (!$('log').children.length) showFatal("连不上电脑", e.message);
        });
    } else {
      note("onLive=false，页面不自行拉取，等原生推历史");
    }
    return true;
  },
  /* 原生已把 WS 事件归约好，整份推进来。页面不自己解析事件流，
     也不重复开 WS —— 那条退路只给浏览器预览用。 */
  setLive: function (items) {
    /* ── 实时区不再渲染任何内容 ──
     *
     * 用户的要求（原话）：「发出来的就当做历史对待，别自己替换了」。
     *
     * 这里原先维护一个独立的实时区：按 turn/step 重建、只装当前这一段，
     * 原生一换 step 就重置 —— 于是「这一段说完，上一段没了」。围绕它我改了
     * 七八版（渲染落点、就地更新、工具合并、思考合并…），每一版都是在给
     * 这套双轨制打补丁，越补越乱。
     *
     * 现在只留一件事：把思考喂给底部那条思考行（它是「运行状态」，不是内容）。
     * 正文、工具、上下文**全部**由 renderHistory 从历史渲染 —— 一条路，不替换。
     * 历史由原生在流式期间高频重推（每来一段增量就刷新一次，250ms 去抖）。
     */
    lastLiveItems = items || [];
    var think = lastLiveItems.filter(function (it) {
      return it && it.kind === "reasoning";
    }).map(function (it) { return it.text || ""; }).join(" ");
    if (think) setThinking(think); else clearThinking();
  },

  setApprovals: function (items) {
    (items || []).forEach(function (a) {
      if (!a.id) return;
      if (log.querySelector('[data-approval="' + a.id + '"]')) return;
      addApproval(a);
    });
  },

  /* 原生推过来的待答问题（只含当前会话）。与 setApprovals 同款：
     已经画过的 callId 不再动它 —— 用户可能正在这道题上勾选。 */
  setQuestions: function (items) {
    (items || []).forEach(function (s) {
      if (!s || !s.callId) return;
      if (s.state && s.state !== "continued") return;
      addQuestion(s);
    });
  },

  /* 兼容原生仍会调一次：现在没有独立的实时区了，只需收掉思考条。 */
  clearLive: function () {
    clearThinking();
    lastLiveItems = null;
  },

  setFiles: setFiles,
  setCards: setCards,
  addAtt: addAtt,
  clearAtts: function () { ATTS = []; renderAtts(); },

  setHistory: function (hist) {
    lastHistory = hist;   /* 留一份，供 setPrefs 就地重画 */
    renderHistory(hist);
  },

  /* 设置页的显示开关。改了立刻重画，不用等原生下一次推历史。 */
  setPrefs: function (o) {
    var next = !!(o && o.showContext);
    if (next === showContext) return;
    showContext = next;
    if (lastHistory) renderHistory(lastHistory);
  },
  setTodos: setTodos,
  setRunning: setRunning,
  showApproval: addApproval,
  clear: function () { log.innerHTML = ""; pend = {}; },
  appendUser: addUser,
  appendAssistant: addAssistantText,
  toast: toast,
  connected: function () { return !!(ws && ws.readyState === 1); }
};

/* ── 兜底自检 ──
   标题停在启动烙印「DSH」说明脚本整个跑完了，只是 init 没来；
   标题还停在「载入中...」说明脚本在中途就断了（连烙印都没写上）。
   这两种在 2.0.2 里长得一模一样，所以必须靠标题来区分。 */
setTimeout(function () {
  if (!__diag.length) {
    var got = ($("title") || {}).textContent || "";
    if (got === "DSH") {
      note("脚本跑完了，但 init 没到");
      var e1 = $("empty");
      if (e1) e1.textContent = "页面脚本已执行，但 App 没把会话配置发过来";
    } else {
      note("脚本没跑到底，标题还是：" + got);
      var e2 = $("empty");
      if (e2) e2.textContent = "页面脚本中途停止（标题=" + got + "）";
    }
  }
}, 3000);

/* 兼容早期约定的别名 */
window.initChat = function (j) { window.dshChat.init(typeof j === "string" ? JSON.parse(j) : j); };
window.appendMessage = function (j) {
  var d = typeof j === "string" ? JSON.parse(j) : j;
  if (d.kind === "user") addUser(d.body, d.clientRequestId);
  else if (d.kind === "reasoning") addAct("思考过程", d.body);
  else addAssistantText(d.body || "");
};
window.appendAssistant = window.dshChat.appendAssistant;
window.showApproval = function (j) { addApproval(typeof j === "string" ? JSON.parse(j) : j); };
window.showQuestion = function (j) { addQuestion(typeof j === "string" ? JSON.parse(j) : j); };
window.setTodos = setTodos;
window.setRunning = setRunning;
window.setConnectionStatus = function (on) { $("dot").className = on ? "on" : "off"; };
</script>
</body>
</html>
