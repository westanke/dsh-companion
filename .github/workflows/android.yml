name: Android CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # v3 action 默认装旧版 'tools'，在新 runner 镜像上已不存在（sdkmanager exit 1）。
          # 显式声明项目实际需要的 SDK 组件；compile/targetSdk = 36。
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # 门禁口径与 AGENTS.md §2/§5 一致：docsCheck + 单测 + 打包 + lint。
      # 2026-10-16 起 lintDebug 提回硬门：历史 16 个 error 已清零（0 error / 52 warning / 4 hint）。
      # AGP 默认只对 error 判失败，warning（依赖升级、plural、unused resources 等）不拦截。
      - run: ./gradlew docsCheck testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: 上传 lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
