name: Android CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # v3 action 默认装旧版 'tools'，在新 runner 镜像上已不存在（sdkmanager exit 1）。
          # 显式声明项目实际需要的 SDK 组件；compile/targetSdk = 36。
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # 门禁口径与 AGENTS.md §2/§5 一致：docsCheck + 单测 + 打包是硬门。
      # lint 当前无 baseline（16 errors / 59 warnings，多为既有问题），只生成报告不拦截；
      # 勿把 lint warning/error 数当门禁（本地 build.sh 也不阻断）。
      - run: ./gradlew docsCheck testDebugUnitTest assembleDebug --no-daemon
      - name: Lint（仅报告，不拦截）
        run: ./gradlew lintDebug --no-daemon || echo "::warning::lint 发现问题（非门禁，见报告 app/build/reports/lint-results-debug.html）"
      - name: 上传 lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
