name: 从 Gitee 同步镜像

# GitHub 为从站：主源 Gitee、备源 AtomGit，都在国内更新，本工作流把代码与
# Release 单向同步到 GitHub。本机到 github.com:443 长期不通，所以不再手工推。
#
# 同步内容：
#   1) refs（全部分支与 tag，push --mirror，主源删除也跟随删除）
#   2) Release（正文 + APK/SHA256SUMS/RELEASE_NOTES，幂等补缺，源码包由 GitHub 自动生成）
#
# 防递归：GITHUB_TOKEN 发起的 push 不会再次触发 workflow（GitHub 官方行为）。
on:
  schedule:
    - cron: '17 */3 * * *'   # 每 3 小时一次（UTC，避开整点）
  workflow_dispatch:          # 重建仓库或临时需要时手工触发

permissions:
  contents: write

concurrency:
  group: mirror-sync
  cancel-in-progress: false   # mirror 推送中途被取消可能留下半截 refs

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 推送镜像（Gitee 主 → AtomGit 备 → GitHub 从）
        run: bash scripts/ci/mirror-push.sh

  releases:
    needs: mirror              # 必须先有 tag，否则 GitHub 会乱造 tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 回填 Release 与发布资产
        run: python3 scripts/ci/sync-releases.py
